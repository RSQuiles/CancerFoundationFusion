# Every experiment in ablate/configs/, in one benchmark comparison.
#
#   python evaluate/plot/plot_ablation_benchmark.py --config evaluate/plot/comparison_all_experiments.yaml --no-show
#
# Reads {model}/metrics/results_*.json only — nothing is recomputed. Produce those
# first with evaluate/analysis_downstream_benchmark.yaml (steps: downstream).
# Groups whose directory holds no results are dropped with a warning, so this is
# safe to run before every experiment has finished.
#
# One group per ablation directory, derived from base_config.trainer.save_dir in
# ablate/configs/*.json. 13 configs collapse to 10 directories:
#   fill.json + paired_alignment_objectives.json -> ablation_paired_alignment_objectives
#   paired_counts.json + paired_config_cscs.json -> ablation_paired_counts
#
# Display names are prefixed ("bigcond/unified") because they must be unique across
# the WHOLE config — experiment_selection.py:250-256 exits on a collision, and
# 'unified', 'dat', 'contrastive' and 'bulk_baseline' each recur in several
# directories. That is also why no group uses 'all_models: true'.

title: "All experiments — downstream benchmark"
output: /cluster/work/boeva/rquiles/outputs/save_CFF/comparison_all_experiments.png

# One figure per task rather than a single grid. Files are named after `output`
# with the task appended:
#   comparison_all_experiments_canc_type_class.png
#   comparison_all_experiments_deconv.png
#   comparison_all_experiments_survival.png
# Colours, bar order and group bands are computed once across all tasks, so the
# three figures stay comparable. Set false (or pass --no-per-task) for the
# combined grid, which then uses `figsize` instead.
per_task: true

# 48 bars per subplot; the auto-derived size is far too small either way.
# Both tuned by rendering.
figsize: [46, 18]          # the combined grid, when per_task is false
per_task_figsize: [46, 11] # each single-task figure

# Print each model's display name above its bar as well as in the legend — with 48
# bars, tracing a colour back to an 8-row legend is otherwise hopeless. The names
# are rotated and the y-range is widened to fit them.
bar_names: true

# Metric subsets, in plot order. Keys verified against what each task actually
# returns today — see canc_type_pred.py:251-262, deconv.py:502-506, and the
# aggregate written by tasks/evaluate_survboard_metrics.py.
metrics:
  canc_type_class: [accuracy, f1_weighted, precision_macro, recall_macro]
  deconv: [mean_pearson_r_present, rmse_present, mean_sample_pearson_r]
  # c_index is written by the task itself; the other three come from the separate
  # SurvBoard evaluation pass and are absent until it has run.
  survival: [c_index, antolini_concordance, ibs, d_calibration]

primary:
  # Set explicitly: the built-in default for deconv is 'mae', which this task no
  # longer emits (it now conditions every metric on cell-type presence), so without
  # this the star would land on whichever metric happens to sort first.
  deconv: mean_pearson_r_present
  canc_type_class: accuracy
  survival: c_index

groups:

  # ── unified-FM feature ablations ─────────────────────────────────────────────

  # base_comparison_ablation.json declares 4 arms, but the directory on disk also
  # holds bulk_baseline and sc_baseline; both are listed so the plot matches reality.
  - name: "Base comparison"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_base_comparison
    experiments:
      - {name: "base/unified",     model: unified_baseline}
      - {name: "base/contrastive", model: contrastive}
      - {name: "base/aggregation", model: aggregation}
      - {name: "base/dat",         model: dat}
      - {name: "base/bulk_only",   model: bulk_baseline}
      - {name: "base/sc_only",     model: sc_baseline}

  - name: "Big condition"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_big_condition
    experiments:
      - {name: "bigcond/unified", model: unified}
      - {name: "bigcond/dat",     model: dat}
      - {name: "bigcond/mmd",     model: mmd}
      - {name: "bigcond/cdd",     model: cdd}

  - name: "United data"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_united_data
    experiments:
      - {name: "united/unified", model: unified}
      - {name: "united/dat",     model: dat}
      - {name: "united/mmd",     model: mmd}
      - {name: "united/cdd",     model: cdd}

  # NOTE: monitor_align's cdd arm trained on corrupted pseudobulks (fixed but not
  # retrained), so treat that one bar as unreliable rather than as a result.
  - name: "Monitor align"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_monitor_align
    experiments:
      - {name: "monitor/unified",   model: unified}
      - {name: "monitor/condition", model: condition}
      - {name: "monitor/mmd",       model: mmd}
      - {name: "monitor/dat",       model: dat}
      - {name: "monitor/cdd",       model: cdd}

  # ── paired datasets ──────────────────────────────────────────────────────────

  - name: "Paired dataset"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_paired_dataset
    experiments:
      - {name: "pdata/bulk_only",   model: bulk_baseline}
      - {name: "pdata/unified",     model: unified}
      - {name: "pdata/dat",         model: dat}
      - {name: "pdata/contrastive", model: contrastive}

  # NOTE the root: paired_counts.json says 'outputs_rquiles', not 'outputs' like
  # every other config. Kept verbatim; if this group comes back empty, that is the
  # first thing to check.
  - name: "Paired counts"
    dir: /cluster/work/boeva/rquiles/outputs_rquiles/save_CFF/ablation_paired_counts
    experiments:
      - {name: "pcounts/bulk_only",   model: bulk_baseline}
      - {name: "pcounts/unified",     model: unified}
      - {name: "pcounts/dat",         model: dat}
      - {name: "pcounts/contrastive", model: contrastive}
      - {name: "pcounts/aggregation", model: aggregation}

  - name: "Paired CORN"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_paired_corn
    experiments:
      - {name: "pcorn/bulk_only",   model: bulk_baseline}
      - {name: "pcorn/unified",     model: unified}
      - {name: "pcorn/dat",         model: dat}
      - {name: "pcorn/contrastive", model: contrastive}
      - {name: "pcorn/aggregation", model: aggregation}

  - name: "Paired mix"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_paired_mix
    experiments:
      - {name: "pmix/unified", model: unified}
      - {name: "pmix/dat_agg", model: dat_agg}

  # Union of paired_alignment_objectives.json and fill.json, which target the same
  # directory (fill.json re-runs only paired_cdd and paired_cdd_agg).
  - name: "Paired alignment objectives"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_paired_alignment_objectives
    experiments:
      - {name: "palign/bulk_only",      model: bulk_baseline}
      - {name: "palign/sc_only",        model: sc_baseline}
      - {name: "palign/mmd",            model: paired_mmd}
      - {name: "palign/cdd",            model: paired_cdd}
      - {name: "palign/mmd_agg",        model: paired_mmd_agg}
      - {name: "palign/cdd_agg",        model: paired_cdd_agg}

  # ── no unified-FM features ───────────────────────────────────────────────────

  - name: "Partition"
    dir: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_partition
    experiments:
      - {name: "part/base",          model: base_model}
      - {name: "part/zinb",          model: zinb_reconstruction}
      - {name: "part/denoise_zinb",  model: denoise_zinb}
      - {name: "part/contrastive",   model: contrastive}
      - {name: "part/agg_contrast",  model: agg_contrastive}
      - {name: "part/all_features",  model: dat_agg_contrastive_denoise_zinb}

  # ── baseline ─────────────────────────────────────────────────────────────────

  # ONE PCA bar, not one per group. With downstream.pca_baseline: true every
  # ablation dir gets its own pca_baseline/, but PCA is re-fitted on each task's own
  # training split and never touches the checkpoint — so all ten are the same number
  # and plotting them all would be ten identical bars. Any directory serves; this one
  # is in the current sweep. Deliberately excluded from every group above.
  - name: "Baseline"
    experiments:
      - name: "PCA"
        path: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_big_condition/pca_baseline

# ── excluded ─────────────────────────────────────────────────────────────────
# example_ablation_config.json -> ablation_test on data/mixed_test: a template that
# has never been trained.
