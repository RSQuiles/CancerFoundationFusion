# experiments:
#   - {name: "Unified", dir: "${save}/ablation_monitor_align", model: unified}
#   - {name: "CDD",     dir: "${save}/ablation_monitor_align", model: cdd}
#   - path: ${save}/ablation_monitor_align/dat      # name defaults to the dir name
