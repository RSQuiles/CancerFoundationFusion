# Configuration for Drug Sensitivity V2.
#
# Task: train one binary classification head for one PRISM-style drug response
# label. Run the task multiple times with different `drug` values to evaluate
# multiple drugs.

finetune:
  drug_sensitivity_v2:
    # ===== REQUIRED =====
    pretrained_model_path: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_base_comparison/unified_baseline/step_step=900000_epoch_epoch=01.ckpt
    head_learning_rate: 0.001

    x_path: /cluster/work/boeva/bulkFM/data/processed/gene_expression.csv
    y_path: /cluster/work/boeva/bulkFM/data/processed/drug_response.csv

    drug: example_drug
    drug_doses:
      example_drug: 1.0

    # ===== LABELS =====
    # IC50 values are expected to be log2-scale. Doses above are linear-scale.
    response_threshold: 0.5
    prediction_threshold: 0.5

    # ===== DATA SPLIT =====
    test_size: 0.2
    train_test_split_version: 1
    random_seed: 42

    # ===== MODEL ARCHITECTURE =====
    hidden_dim: 256
    dropout: 0.1

    # ===== TRAINING HYPERPARAMETERS =====
    epochs: 30
    batch_size: 64
    embed_batch_size: 64
    normalized: true

    min_lr: 0.000001
    first_cycle_steps: 20
    cycle_mult: 2.0
    warmup_steps: 5
    gamma: 0.9
    grad_accumulation_steps: 1
    max_grad_norm: 1000000.0

    # ===== OUTPUT =====
    save_dir: ./checkpoints/drug_sensitivity_v2
