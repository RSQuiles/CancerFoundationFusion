# Defaults for evaluate/integration/scib_benchmark.py (--config). Keys are option names;
# the CLI overrides them. The scib: block applies to the script; top-level keys too.
# root: /cluster/work/boeva/rquiles/unifiedFM_experiments

scib:
  name: bulk_only_pretraining
  models: [bulk_only, bulkformer, pca]
  # pre_integrated: pca          # reference embedding for PCR; not a row of the table
  part: test
  modalities: [bulk]
  per_modality: ["bulk=all"]
  batch_key: modality
  label_key: tissue_general
  bio_only: true
  # filter: ["tissue_general=lung,breast"]
  n_jobs: 1
  row_labels:                # names of the results table rows (default: the model names)
    bulk_only: Bulk-only UnifiedFM
    unified_paired_dat_tissue_s0: CF paired + DAT
    bulkformer: BulkFormer
    pca: PCA
  # plot_formats: [png, pdf, svg]
