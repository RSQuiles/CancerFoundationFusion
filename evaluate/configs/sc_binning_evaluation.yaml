# Evaluation of the sc_binning launch (experiments/configs/sc_binning.json): sc_quantile
# vs sc_midrank, the same single-cell model trained with the two binning methods.
#
#   CONFIG=evaluate/configs/sc_binning_evaluation.yaml sbatch evaluate/run_evaluation.sh
#   python -m evaluate.run_evaluation --config evaluate/configs/sc_binning_evaluation.yaml --list
#
# Each model embeds and reconstructs with the binning it was trained with (stored in the
# checkpoint as binning_method), so nothing here sets the method.
#
# Comparing the two in reconstruction: their targets are binned differently, so their
# native numbers (MAE in bins, bin accuracy) are NOT on one scale. The reconstruction
# figures put them in separate groups (bins51 vs bins51_midrank, each with its own
# baselines) and compare them directly only on the space-free metrics (per-sample
# Pearson/Spearman, non-zero Spearman, zero AUROC) in the group "all"; compare.py leaves
# the native columns out for the same reason.

project_root: /cluster/work/boeva/rquiles/CancerFoundationFusion

shared:
  root: /cluster/work/boeva/rquiles/unifiedFM_experiments

default_environment: container
environments:
  container:                # bionemo image: CancerFoundation, GPU
    command: [singularity, run, --nv,
              --pwd, /cluster/work/boeva/rquiles/CancerFoundationFusion,
              --bind, "/cluster/work/boeva/rquiles,/cluster/work/boeva/eheiss,/cluster/work/boeva/bulkFM",
              /cluster/customapps/biomed/boeva/rquiles/bionemo-framework_v1.sif,
              python, -u]
  host: {}                  # the env run_evaluation.sh activated (pandas, pyarrow, matplotlib, scib_metrics)

# Colour keys tried on every UMAP; columns the sc file lacks are skipped with a warning.
# cell_type is the label single-cell embeddings usually separate by first: in atlas data,
# lung T cells sit next to blood T cells, so tissue is a weaker, secondary signal.
tasks:
  # ---- 1. embeddings ------------------------------------------------------------------
  # embeddings/<model>/sc_test.h5ad: input_mode train_matched (the default): each cell is
  # binned over all its vocabulary genes, then fed its top-ranked zero genes (40% of the
  # 1199 slots) and top-ranked expressed genes, as in training. The ranking is the
  # single-cell HVG score, fitted label-free on these rows.
  # embeddings/<model>/legacy_panel/sc_test.h5ad: the old fixed 1200-HVG panel (binned
  # within the panel, every zero kept), for the A/B comparison.
  # embeddings/pca_sc_leiden_s0/: PCA baseline (CP10K/CPM + log1p HVGs), fitted on a train
  # subset. Its own name, so it never overwrites embeddings/pca/ of another split.
  # All three use the same 20k stratified test rows (same subset arguments and seed).
  embed:
    shared:
      split: leiden_s0
      modalities: [sc]
      test_subset: 20000          # stratified on tissue_general
      stratify_by: [tissue_general]
    steps:
      embed_splits:
        foreach: {model: [sc_quantile, sc_midrank]}
        args:
          parts: [test]
          input_mode: train_matched
          zero_fraction: 0.4
      embed_legacy:
        script: embed_splits
        foreach: {model: [sc_quantile, sc_midrank]}
        args:
          parts: [test]
          input_mode: legacy_panel
          variant: legacy_panel
      embed_pca:
        script: embed_splits
        args:
          embedder: pca
          name: &pca pca_sc_leiden_s0
          parts: [test, train_subset]
          train_subset: 5000

  # ---- 2. UMAPs of the single-cell test split -----------------------------------------
  representation:
    shared:
      part: test
      stratify_by: [tissue_general]
      skip_unknown: true
      labels: {tissue_general: Tissue, cell_type: Cell type, assay: Assay, dataset_id: Dataset}
      modality: sc
      subsample: 20000
      color: [tissue_general, cell_type, assay, dataset_id]
    steps:
      umap:                       # -> results/representation/<model>/
        args:
          models: [sc_quantile, sc_midrank, *pca]
          title: "{model}: {modality_name} ({part})"
      umap_legacy:                # -> results/representation/<model>/legacy_panel/
        script: umap
        args:
          models: [sc_quantile, sc_midrank]
          variant: legacy_panel
          title: "{model}: {modality_name} ({part}), legacy panel"

  # ---- 3. scIB bio conservation on the sc test split (bulkFM env: scib_metrics) ------------
  # One table per input mode and label (a run reads one variant for every model). Raw
  # scores (scib.csv) compare across tables: same rows, same subsample. The PCA baseline
  # is a row of the train_matched tables.
  alignment:
    shared:
      part: test
      modalities: [sc]
      per_modality: ["sc=all"]
      bio_only: true
      n_jobs: 4
    steps:
      scib_tissue:
        environment: host
        script: scib
        args:
          name: sc_binning_tissue
          models: [sc_quantile, sc_midrank, *pca]
          label_key: tissue_general
      scib_tissue_legacy:
        environment: host
        script: scib
        args:
          name: sc_binning_tissue_legacy
          models: [sc_quantile, sc_midrank]
          variant: legacy_panel
          label_key: tissue_general
      scib_cell_type:             # needs a cell_type column in the sc obs
        environment: host
        script: scib
        continue_on_error: true
        args:
          name: sc_binning_cell_type
          models: [sc_quantile, sc_midrank, *pca]
          label_key: cell_type
      scib_cell_type_legacy:
        environment: host
        script: scib
        continue_on_error: true
        args:
          name: sc_binning_cell_type_legacy
          models: [sc_quantile, sc_midrank]
          variant: legacy_panel
          label_key: cell_type

  # ---- 4. reconstruction on the single-cell r25 plan -------------------------------------
  reconstruction:
    steps:
      # The plan was made for the bulk_sc_pretrain evaluation; run this step only if
      # data/single_cell/splits/leiden_s0/masks/test_r25.npz does not exist yet
      # (--only reconstruction.mask_plan_sc).
      mask_plan_sc:
        script: mask_plan
        enabled: false
        args:
          modality: sc
          split: leiden_s0
          part: test
          name: r25
          mask_ratio: 0.25
          seq_len: 1200
          n_samples: 2000
          zero_fraction: 0.4
          stratify_by: [tissue_general]

      cf_sc:
        script: reconstruction
        foreach: {model: [sc_quantile, sc_midrank]}
        args:
          plan: &sc_plan sc:leiden_s0:test:r25
          group_by: [tissue_general]
          batch_size: 16

      # Optional: the same models on the bulk r25 plan (out of domain for sc-only models).
      cf_bulk:
        script: reconstruction
        enabled: false
        foreach: {model: [sc_quantile, sc_midrank]}
        args:
          plan: &bulk_plan bulk:leiden_s0:test:r25
          group_by: [tissue_general]
          batch_size: 16

      compare:                    # -> results/assessment/reconstruction_sc_leiden_s0_test_r25_sc_binning/
        environment: host
        args:
          plan: *sc_plan
          models: &models [sc_quantile, sc_midrank]
          name: sc_binning
          baselines: true
      plot:                       # -> results/tasks/reconstruction/_plots/<plan>/sc_binning/
        script: reconstruction_plot
        environment: host
        args:
          plan: *sc_plan
          models: *models
          name: sc_binning
          baselines: true
