# SurvBoard metrics for every model of every ablation directory in the downstream
# sweep.
#
#   python evaluate/finetune/scripts/run_ablation_survboard_metrics.py \
#       --config evaluate/finetune/scripts/ablation_survboard_metrics.yaml --dry-run
#   python evaluate/finetune/scripts/run_ablation_survboard_metrics.py \
#       --config evaluate/finetune/scripts/ablation_survboard_metrics.yaml
#   ... --only big_condition            # one ablation
#
# Needs the SurvBoard environment (pycox, sksurv, survival_evaluation) — see
# scripts/ablation_survboard_metrics.sh. --dry-run / --list need nothing.
#
# This computes NOTHING from checkpoints. It reads the survival functions the
# 'survival' downstream task already wrote to
#   {survboard_results_dir}/{COHORT}/{CANCER}/{ablation}_{model}/split_{fold}.csv
# and writes, per model,
#   {ablation_dir}/{model}/metrics/results_survival.json          (antolini, ibs,
#                                                                  d_calibration;
#                                                                  keeps c_index)
#   {ablation_dir}/{model}/metrics/results_survival_detailed.csv  (per cohort/cancer/fold)
# so run it AFTER the 'downstream' step of analysis_downstream_benchmark*.yaml and
# BEFORE the 'benchmark' plot — three of the four survival bars do not exist until
# this has run.

vars:
  work: /cluster/work/boeva/rquiles

# Base defaults come from the survival task config's finetune.survival block:
# survboard_data_dir, splits_dir, survboard_results_dir, cohorts, cancer_types.
# Inheriting rather than copying is deliberate — survboard_results_dir must be the
# directory the task actually WROTE to, and the cancer_types list must be the one it
# ran on. Every other key in that file (checkpoint, ablation_dir, fold_index, the
# training hyperparameters) is ignored here.
task_config: evaluate/finetune/configs/survival_pred_config.yaml

defaults:
  # Uncomment to override what task_config supplies:
  # survboard_data_dir:    /cluster/work/boeva/bulkFM/data/processed/survboard
  # splits_dir:            /cluster/work/boeva/bulkFM/data/processed/survboard/splits
  # survboard_results_dir: ${work}/outputs/survival/functions
  # cohorts:               [TCGA, ICGC]
  # cancer_types:          [KIRC, LGG, ...]

  ibs_grid_len: 100

  # null -> every sub-directory of ablation_dir holding a checkpoint or a metrics/
  # directory. The metrics/ clause is what includes pca_baseline/, which has no
  # checkpoint but does get scored by the survival task.
  models: null

  # false: recompute even where results_survival.json already holds SurvBoard
  # metrics. Cheap (it is CSV reading, not GPU work) and it keeps the numbers in
  # step with the CSVs. Set true, or pass --skip-existing, to resume a run.
  skip_existing: false

# Union of the experiments in evaluate/analysis_downstream_benchmark.yaml and
# evaluate/analysis_downstream_benchmark_small.yaml — the same directories, in the
# same order, with the same names, so the two configs can be compared line by line.
# The 'normalize' settings there are irrelevant here: normalization affects
# embedding, and this step reads survival functions that already exist.
ablations:

  - name: ablation_paired_alignment_objectives                       # paired_counts.json / paired_config_cscs.json
    ablation_dir: ${work}/outputs/save_CFF/ablation_paired_alignment_objectives

# ─────────────────────────────────────────────────────────────────────────────
# Directory naming, and what happened to the old CSVs
# ─────────────────────────────────────────────────────────────────────────────
# Survival CSVs live in {ablation_dir basename}_{model}, e.g.
#   functions/TCGA/BRCA/ablation_big_condition_unified/split_5.csv
# so the eight ablations above can share one survboard_results_dir safely. The
# naming lives in evaluate/finetune/survival_layout.py; writer and reader both go
# through it. --dry-run prints the resolved directory for every model.
#
# Until this change the directory was the bare model name, and names like 'unified',
# 'dat' and 'bulk_baseline' recur across these ablations — so those models shared one
# set of CSVs and were scored on whichever survival run wrote last.
#
# CSVs from before the change are ORPHANED: they cannot be attributed to an ablation,
# so nothing reads them. --dry-run lists which models still have them, and they can
# be deleted. Re-run the survival task to regenerate under the new layout.
#
# The pre-flight collision check still runs, because two entries whose ablation
# directories share a basename under different roots would collide again — this
# config has exactly such a pair (paired_counts under outputs vs outputs_rquiles),
# though only one of the two is listed. If one ever fires, give that ablation its own
# results dir:
#
#   - name: big_condition
#     ablation_dir: ${work}/outputs/save_CFF/ablation_big_condition
#     survboard_results_dir: ${work}/outputs/survival/functions/big_condition
