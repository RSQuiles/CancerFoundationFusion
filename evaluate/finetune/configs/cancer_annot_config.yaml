# Normalized Configuration for Cancer Type Classification
# This follows the standardized downstream task configuration structure

finetune:
  canc_type_class:
    # ===== REQUIRED =====
    # Path to pretrained model checkpoint
    pretrained_model_path: /cluster/work/boeva/rquiles/outputs/save_CFF/ablation_base_comparison/unified_baseline/step_step=900000_epoch_epoch=01.ckpt
    
    # Path to TCGA data (H5AD format)
    tcga_data_dir: /cluster/work/boeva/eheiss/datasets/TCGA/tcga.h5ad
    
    # Learning rate for the head
    head_learning_rate: 0.001
    
    # ===== DATA CONFIGURATION =====
    # TCGA cohorts to include
    # cohorts: [BRCA, BLCA, GBM, LGG, LUAD, UCEC]
    cohorts: [BRCA, BLCA, COAD, GBM, HNSC, KIRC, KIRP, LAML, LGG, LIHC, LUAD, LUSC, MESO, OV, PAAD, PRAD, READ, SARC, SKCM, STAD, TGCT, THCA, UCEC, UCS]
    
    # Whether to merge GBM and LGG into single class
    merge_gbm_lgg: true
    
    # Whether this task's input MUST be normalized (CP10K + log1p) before embedding.
    # "do it?" space: true = apply it, false = apply nothing. When true it is skipped
    # with a warning if the matrix does not look like raw counts, so nothing is ever
    # normalized twice. Overridden by run_ablation_downstream.py
    # --normalize / --no-normalize.
    #
    # Replaces `normalized:`, which meant the OPPOSITE ("already normalized, so
    # skip"). Before this key existed the effective behaviour here was log1p (and
    # CP10K+log1p for the PCA baseline, which is the mismatch this replaces); set
    # `normalize: true` to normalize again, now identically for both embedders.
    normalize: false
    
    # Minimum number of genes per cell (filtering)
    min_genes: 200
    
    # Train/test split ratio
    test_size: 0.2
    
    # Random seed for reproducible splits
    random_seed: 42
    
    # Version string for deterministic train/test split
    # (alternative to random_seed for versioning splits)
    train_test_split_version: 1
    
    # ===== MODEL ARCHITECTURE =====
    # Hidden dimension of the head
    hidden_dim: 256
    
    # Dropout for the head
    dropout: 0.1
    
    # ===== TRAINING HYPERPARAMETERS =====
    # Number of training epochs
    epochs: 30
    
    # Batch size for training and evaluation
    batch_size: 64
    
    # Minimum learning rate
    min_lr: 0.000001
    
    # Alternative to min_lr: ratio of min_lr to max_lr
    # min_lr_ratio: 0.001
    
    # Learning rate scheduler configuration (cosine annealing with warmup)
    first_cycle_steps: 15
    cycle_mult: 2.0
    warmup_steps: 5
    gamma: 0.9
    
    # Gradient accumulation steps
    grad_accumulation_steps: 1
    
    # Max gradient norm for clipping
    max_grad_norm: 1000000.0
    
    # ===== FINE-TUNING (optional) =====
    # Set to true to unfreeze the pretrained encoder and fine-tune it end-to-end
    # alongside the head. Raw expression data will be passed through the transformer
    # on every training step instead of using pre-computed frozen embeddings.
    finetune_embedder: true

    # Learning rate for the transformer encoder when finetune_embedder is true.
    # Should be much smaller than head_learning_rate to avoid catastrophic forgetting.
    embedder_learning_rate: 0.00001

    # ===== OUTPUT =====
    # Directory to save checkpoints
    save_dir: ./checkpoints/cancer_classification
