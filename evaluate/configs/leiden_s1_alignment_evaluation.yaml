# Evaluation of the alignment-loss ablation (experiments/configs/leiden_s1_alignment.json):
# each alignment loss on its own, the InfoNCE form of the aggregation loss, DAT, and the
# combinations paired + aggregation (InfoNCE) + one class/marginal loss. Thirteen runs
# warm-started from unified_baseline, 50k steps each, differing only in the alignment loss
# they train on. align_combo (every loss together) is trained by the launch config but not
# evaluated here: it trains the paired loss with the default form and weight.
# Stage 2 (align_dat and the three combos) was added later: with recompute: false (shared)
# the whole config reruns, skipping every result already present, so only the new models
# are embedded, plotted, scored, reconstructed and probed; every comparison is rebuilt.
# A seed-1 control (align_ctrl_s1) would be added to the model lists below (anchors runs,
# all, scib_models, geneicl_models, row_labels).
# The loss weights were calibrated (align_calib, checkpoints/align_calib/loss_balance.json):
# each term pulls on the backbone with the same share of the reconstruction gradient at the
# parent, so the runs differ in what they align, not in how hard they push.
# Training batches: 96 rows (38 bulk, 38 pseudobulk, 20 cells; 6 shared tissues with ~5 rows
# per domain; 4 cells per pseudobulk and per pair), flex attention + gradient checkpointing;
# the parent trained at 64 rows with mha, so every effect is read against align_ctrl.
#   align_ctrl                  no alignment loss: the reference
#   align_mmd                   marginal (MMD)
#   align_contrastive           class-conditional, tissue InfoNCE
#   align_cdd                   class-conditional, CDD (no warmup, 1000-step ramp)
#   align_paired                instance level, paired batches: InfoNCE over the batch's pairs
#   align_paired_mse            the same with the original MSE paired loss (compare the two)
#   align_agg_ctrl, align_agg   pseudobulk <-> its own cells; the control draws the same
#                               cells but only logs the loss (loss_weight_agg 0)
#   align_agg_infonce           the same batches, aggregation as InfoNCE (own cell mean vs the
#                               batch's other pseudobulks' cell means)
#   align_dat                   marginal, adversarial (bulk vs pseudobulk discriminator;
#                               weight 10, the reversed gradient ramped in over 1000 steps)
#   align_combo_cdd             paired (InfoNCE) + aggregation (InfoNCE) + CDD
#   align_combo_contrastive     paired (InfoNCE) + aggregation (InfoNCE) + contrastive
#   align_combo_dat             paired (InfoNCE) + aggregation (InfoNCE) + DAT
# The parent, unified_baseline, is a row everywhere (its embeddings and reconstruction runs
# come from leiden_s1_baselines_evaluation.yaml; embed_parent re-embeds it if needed).
#
#   CONFIG=evaluate/configs/leiden_s1_alignment_evaluation.yaml sbatch evaluate/run_evaluation.sh
#
# How to read it:
#   - an effect is a difference to align_ctrl. Stage 1 has no seed-1 control, so the noise
#     floor is not measured: trust an effect that shows in several metrics in the same
#     direction, not a small difference in one;
#   - bulk <-> pb: scib_bulk_pb (mixing vs tissue), the integration summary's pair links
#     (test pairs were never seen in training: does align_paired generalize? InfoNCE vs MSE);
#   - pseudobulk <-> its cells (agg): scib_sc_pb, the summary's pseudobulk-vs-cells links and
#     the alignment_pb_cells UMAPs, compared within align_ctrl / align_agg_ctrl / align_agg /
#     align_agg_infonce (same batches: MSE vs InfoNCE aggregation);
#   - the cost: bio conservation per modality (own panels), reconstruction with the
#     expression decoder (gen) and from the CLS embedding alone (mvc), GeneICL.
# Two reconstruction comparisons per plan: leiden_s1_alignment (parent, control, the
# single-loss runs incl. both paired forms, DAT and the three combos) and
# leiden_s1_alignment_agg (parent, control, the three aggregation runs).
#
# Prerequisite: curated tissue labels (map_archs4_tissue.sh --curate-only) before embed.

project_root: /cluster/work/boeva/rquiles/CancerFoundationFusion

shared:
  root: /cluster/work/boeva/rquiles/unifiedFM_experiments
  # false: a model's result already present at its usual location is skipped ([skip] in
  # the log), so adding a model computes only that model; comparisons, summaries and
  # cross-model figures are always redone. Not checked for staleness: after retraining a
  # model, delete its results or run with --recompute (or set true here / per step).
  recompute: false

default_environment: container
environments:
  container:                # bionemo image: CancerFoundation, GPU
    command: [singularity, run, --nv,
              --pwd, /cluster/work/boeva/rquiles/CancerFoundationFusion,
              --bind, "/cluster/work/boeva/rquiles,/cluster/work/boeva/eheiss,/cluster/work/boeva/bulkFM",
              /cluster/customapps/biomed/boeva/rquiles/bionemo-framework_v1.sif,
              python, -u]
  geneicl:                  # GeneICL's eval env; run_probe reads $GENEICL_PYTHON
    setup: |
      source ~/.bashrc
      conda activate geneicl || exit 1
      export GENEICL_PYTHON="$(command -v python)"
  host: {}                  # the env run_evaluation.sh activated (bulkFM: scib_metrics, matplotlib)

tasks:
  # ---- 1. embeddings (joint panel + own panel per modality) ----------------------------
  embed:
    shared:
      split: leiden_s1
      test_subset: 30000
      stratify_by: [tissue_general]
      # MUST match the embed block of leiden_s1_baselines_evaluation.yaml: unified_baseline
      # and pca_leiden_s1 are rows here with the files embedded there, scIB keeps only the
      # rows every model embedded, and the link metrics take each model's own file. The
      # subsample depends on obs and these settings only, so equal settings = equal rows.
      # Proportional test subsets, "unknown" at most 5%, single-cell "paired" and bulk
      # "cell line" at most 10%, "in vitro" and "xenograft" at most 5%.
      # Linked single cells, each link column with its own budget (filled in this order):
      #   - every test pair in all modalities, up to 50 cells each (<= 6% = 1800 cells);
      #   - test pseudobulks with 15 of their cells each (<= 30% = 9000 cells, ~600 of the
      #     2000): the stored 30 cells are already a sample of the ~1000 a pseudobulk was
      #     made from, so 15-cell means over many pseudobulks beat 30-cell means over few.
      # Pairs are exclusive: a pair not kept is left out of every modality. Pseudobulks are
      # not (linked_exclusive false): only a kept pseudobulk's cells beyond its 15 are left
      # out, so the pseudobulk file keeps all 2035 test rows and the fill (~19000 cells) may
      # draw cells of the other pseudobulks, keeping the tissue mix of the test split. Bulk
      # and pseudobulk test parts are below 30000, so they are complete.
      stratify_mode: proportional
      unknown_frac: 0.05
      cap_labels: {paired: 0.1, "cell line": 0.1, "in vitro": 0.05, xenograft: 0.05}
      keep_linked: ["paired:0", "pseudobulk_id:0,-1"]
      linked_frac: {paired: 0.06, pseudobulk_id: 0.30}
      linked_per_key: {paired: 50, pseudobulk_id: 15}
      linked_exclusive: {paired: true, pseudobulk_id: false}
      linked_quota: budget
    steps:
      cf_joint:
        script: embed_splits
        foreach:
          model: &runs [align_ctrl, align_mmd, align_contrastive, align_cdd, align_paired,
                        align_paired_mse, align_agg_ctrl, align_agg, align_agg_infonce,
                        align_dat, align_combo_cdd, align_combo_contrastive, align_combo_dat]
        args:
          modalities: [sc, bulk, pseudobulk]
          parts: [test]
      cf_own_panel:
        script: embed_splits
        foreach:
          model: *runs
          modalities: [[sc], [bulk], [pseudobulk]]
        args:
          variant: own_panel
          parts: [test]
      # embed_parent:             # only if unified_baseline was embedded before curating
        # script: embed_splits
        # enabled: false
        # foreach:
          # model: [unified_baseline]
          # modalities: [[sc, bulk, pseudobulk]]
        # args:
          # parts: [test]

  # ---- 2. representation figures (CPU) -------------------------------------------------
  representation:
    shared:
      part: test
      stratify_by: [tissue_general]
      stratify_mode: proportional       # as in the baselines config
      unknown_frac: 0.05
      cap_labels: {paired: 0.1, "cell line": 0.1, "in vitro": 0.05, xenograft: 0.05}
      skip_unknown: true
      labels: {tissue_general: Tissue, modality: Modality, paired: Pair}
    steps:
      umap_bulk_pb:
        script: umap
        foreach: {modality: [bulk, pseudobulk]}
        args:
          models: &all [unified_baseline, align_ctrl, align_mmd, align_contrastive, align_cdd,
                        align_paired, align_paired_mse, align_agg_ctrl, align_agg, align_agg_infonce,
                        align_dat, align_combo_cdd, align_combo_contrastive, align_combo_dat]
          variant: own_panel
          subsample: 20000
          color: [tissue_general]
          title: "{model}: {modality_name} ({part})"
      alignment:
        args:
          models: *all
          per_modality: ["sc=5000", "bulk=all", "pseudobulk=all"]
          color: [modality, tissue_general, paired]
          connect_pairs: true
          cell_means: true
          link_col: pseudobulk_id
          title: "{model}: modality alignment ({counts})"
      # Each modality pair and all three, matched: per tissue the same number of rows from
      # every modality (the smallest count; curated tissues only, seed 0), the rows the
      # matched scIB runs score -> alignment_test_<mods>_matched_cellxgene-archs4.png.
      # The modality order of each set is the scIB run's (it fixes the seeded draw).
      alignment_matched:
        script: alignment
        foreach:
          modalities: [[bulk, pseudobulk], [sc, pseudobulk], [sc, bulk], [sc, pseudobulk, bulk]]
        args:
          models: *all
          match_labels: true
          filter: ["tissue_label_source=cellxgene,archs4"]
          seed: 0
          color: [modality, tissue_general]
          title: "{model}: {modalities}, matched per tissue ({counts})"
      alignment_pairs:
        script: alignment
        args:
          models: *all
          paired_only: true
          per_modality: ["sc=all", "bulk=all", "pseudobulk=all"]
          color: [paired]            # shapes give the modality, colour the pair
          connect_pairs: true
          cell_means: true
          link_col: paired
          title: "{model}: test pairs, cells mean -> pseudobulk -> bulk ({counts})"
      # A few curated-tissue pseudobulks per tissue with their 15 test cells and cell means
      # -> alignment_test_pb_cells_<filter>.png; the same pseudobulks for every model.
      alignment_pb_cells:
        script: alignment
        args:
          models: *all
          pb_cells: true
          pb_min_cells: 15
          cells_per_pb: 15
          filter: ["tissue_label_source=cellxgene,archs4"]
          color: [pseudobulk_id, tissue_general]
          title: "{model}: pseudobulks and their own cells ({counts})"

  # ---- 3. integration: scIB + link metrics (bulkFM env) --------------------------------
  integration:
    shared:
      part: test
      label_key: tissue_general
      filter: ["tissue_label_source=cellxgene,archs4"]
      n_jobs: 1
      row_labels: &row_labels
        unified_baseline: "parent (no alignment)"
        align_ctrl: "control"
        align_mmd: "+ MMD"
        align_contrastive: "+ contrastive"
        align_cdd: "+ CDD"
        align_paired: "+ paired (InfoNCE)"
        align_paired_mse: "+ paired (MSE)"
        align_agg_ctrl: "agg batches, control"
        align_agg: "+ aggregation (MSE)"
        align_agg_infonce: "+ aggregation (InfoNCE)"
        align_dat: "+ DAT"
        align_combo_cdd: "paired + agg + CDD"
        align_combo_contrastive: "paired + agg + contrastive"
        align_combo_dat: "paired + agg + DAT"
        pca_leiden_s1: "PCA"
    steps:
      scib_bulk_pb:             # the main alignment table: batch = modality, label = tissue
        environment: host
        script: scib
        args:
          name: leiden_s1_alignment_bulk_pb
          models: &scib_models [unified_baseline, align_ctrl, align_mmd, align_contrastive, align_cdd,
                                align_paired, align_paired_mse, align_agg_ctrl, align_agg, align_agg_infonce,
                                align_dat, align_combo_cdd, align_combo_contrastive, align_combo_dat,
                                pca_leiden_s1]
          pre_integrated: pca_leiden_s1
          modalities: [bulk, pseudobulk]
          batch_key: modality
          shared_labels: true       # as in the baselines config
          # per tissue, as many bulk rows as pseudobulk rows (the smaller count), drawn with
          # the fixed seed: bulk is ~9x pseudobulk and would fill every neighborhood otherwise
          match_labels: true
      scib_sc_pb:               # the agg question (and side effects of the bulk losses)
        environment: host
        script: scib
        args: &scib_sc
          name: leiden_s1_alignment_sc_pb
          models: *scib_models
          pre_integrated: pca_leiden_s1
          modalities: [sc, pseudobulk]
          match_labels: true
          batch_key: modality
          shared_labels: true
      scib_all:
        environment: host
        script: scib
        args:
          <<: *scib_sc
          name: leiden_s1_alignment_all
          modalities: [sc, pseudobulk, bulk]
      # Cost of alignment inside each modality: bio conservation on own panels.
      scib_sc_tissue:
        environment: host
        script: scib
        args: &bio
          name: leiden_s1_alignment_sc_tissue
          models: *scib_models
          variant: own_panel
          bio_only: true
          modalities: [sc]
          per_modality: ["sc=all"]
      scib_bulk_tissue:
        environment: host
        script: scib
        args:
          <<: *bio
          name: leiden_s1_alignment_bulk_tissue
          modalities: [bulk]
          per_modality: ["bulk=all"]
      scib_pb_tissue:
        environment: host
        script: scib
        args:
          <<: *bio
          name: leiden_s1_alignment_pb_tissue
          modalities: [pseudobulk]
          per_modality: ["pseudobulk=all"]
      # Link metrics (pair and cell-mean nearest neighbours) + one summary table.
      summary:
        environment: host
        script: integration
        drop: [filter, n_jobs]
        args:
          name: leiden_s1_alignment
          models: *scib_models
          label_filter: ["tissue_label_source=cellxgene,archs4"]
          min_cells: 15          # pseudobulks are kept with 15 test cells (pairs up to 50)
          scib_runs: [leiden_s1_alignment_bulk_pb, leiden_s1_alignment_sc_pb, leiden_s1_alignment_all]

  # ---- 4. reconstruction: the cost on the decoders (r25 plans from the baseline eval) ---
  reconstruction:
    steps:
      cf_gen:
        script: reconstruction
        foreach:
          model: *runs
          plan: &plans [sc:leiden_s1:test:r25, bulk:leiden_s1:test:r25, pseudobulk:leiden_s1:test:r25]
        args: &cf_run
          group_by: [tissue_general]
          batch_size: 16
      cf_mvc:
        script: reconstruction
        foreach:
          model: *runs
          plan: *plans
        args:
          <<: *cf_run
          head: mvc
      # Per plan, four comparisons: main (parent, control, MMD, contrastive, CDD, paired
      #   InfoNCE and MSE, DAT, the three combos) and agg (parent, control, agg_ctrl, agg MSE
      #   and InfoNCE), each for gen and mvc.
      compare:                  # -> results/reconstruction/_compare/<plan>/<name>/
        environment: host
        foreach: {plan: *plans}
        args: &cmp_main
          name: leiden_s1_alignment
          models: [unified_baseline, align_ctrl, align_mmd, align_contrastive, align_cdd,
                   align_paired, align_paired_mse, align_dat, align_combo_cdd,
                   align_combo_contrastive, align_combo_dat]
          baselines: true
      compare_agg:
        script: compare
        environment: host
        foreach: {plan: *plans}
        args: &cmp_agg
          name: leiden_s1_alignment_agg
          models: [unified_baseline, align_ctrl, align_agg_ctrl, align_agg, align_agg_infonce]
          baselines: true
      compare_mvc:
        script: compare
        environment: host
        foreach: {plan: *plans}
        args: &cmp_main_mvc
          name: leiden_s1_alignment_mvc
          models: [unified_baseline@mvc, align_ctrl@mvc, align_mmd@mvc, align_contrastive@mvc,
                   align_cdd@mvc, align_paired@mvc, align_paired_mse@mvc, align_dat@mvc,
                   align_combo_cdd@mvc, align_combo_contrastive@mvc, align_combo_dat@mvc]
          baselines: true
      compare_agg_mvc:
        script: compare
        environment: host
        foreach: {plan: *plans}
        args: &cmp_agg_mvc
          name: leiden_s1_alignment_agg_mvc
          models: [unified_baseline@mvc, align_ctrl@mvc, align_agg_ctrl@mvc, align_agg@mvc,
                   align_agg_infonce@mvc]
          baselines: true
      plot:                     # -> results/reconstruction/_plots/<plan>/<name>/
        script: reconstruction_plot
        environment: host
        foreach: {plan: *plans}
        args: *cmp_main
      plot_agg:
        script: reconstruction_plot
        environment: host
        foreach: {plan: *plans}
        args: *cmp_agg
      plot_mvc:
        script: reconstruction_plot
        environment: host
        foreach: {plan: *plans}
        args: *cmp_main_mvc
      plot_agg_mvc:
        script: reconstruction_plot
        environment: host
        foreach: {plan: *plans}
        args: *cmp_agg_mvc

  # ---- 5. GeneICL benchmark (bulk downstream tasks) --------------------------------------
  geneicl:
    shared:
      geneicl_repo: /cluster/work/boeva/rquiles/Codebases/GeneICL
      suite: benchmark
    steps:
      geneicl_embed:
        foreach: {model: *runs}
        args:
          modality: bulk
          gene_ids: auto
          batch_size: 64
          overwrite: true
      geneicl_probe:
        environment: geneicl
        foreach: {model: *runs}
        args:
          seed: 42
          resume: false
      geneicl_compare:
        environment: geneicl
        args:
          models: &geneicl_models [unified_baseline, align_ctrl, align_mmd, align_contrastive, align_cdd,
                                   align_paired, align_paired_mse, align_agg_ctrl, align_agg,
                                   align_agg_infonce, align_dat, align_combo_cdd,
                                   align_combo_contrastive, align_combo_dat, pca]
          reference: [scfoundation, en]
          name: leiden_s1_alignment
      geneicl_plot:
        environment: geneicl
        args:
          models: *geneicl_models
          reference: [scfoundation, en]
          name: leiden_s1_alignment
          formats: [png, pdf]
