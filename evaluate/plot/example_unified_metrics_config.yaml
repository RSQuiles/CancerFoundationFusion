# Config for:
#   python evaluate/plot/plot_unified_metrics_table.py --config <this file> --no-show
#
# Every trained run in ablate/configs/, in one table. Metrics are read from each run's
# metrics/unified_metrics.json and (for the scIB columns) from that ablation's
# _scib_metrics/scib_<tag>.csv; nothing is recomputed. Runs whose metrics have not been
# computed yet are skipped with a warning rather than failing the figure, so this
# config is usable before every experiment has finished.
#
# The run-selection grammar ('vars' / 'groups' / 'experiments') is shared with
# example_comparison_config.yaml.
#
# ── Read this before comparing rows across groups ────────────────────────────────
# Each ablation directory was evaluated on its OWN eval.h5ad, built from its own
# adata_dir with its own gene panel. Numbers are therefore strictly comparable WITHIN
# a group and only indicative ACROSS groups. The script can flag this (the runs will
# not share a panel_hash) on stderr and as a red figure footnote, but that is off
# unless you set 'panel_warning: true' — across groups it fires unconditionally and
# tells you nothing new. Two consequences worth expecting:
#   * The paired_* and agg_paired_* families are blank (n/a) for the experiments whose
#     data has no paired bulk/pseudobulk rows — base comparison, big condition, united
#     data, monitor align and partition. That is missing input, not a bad model.
#   * ablation_partition trains none of the unified-FM objectives, so it is the
#     reference for "what these metrics look like without them".
# For a publication-grade comparison, restrict the config to one group.

vars:
  # Expanded into every ${work} below; falls back to the environment if not set here.
  work: /cluster/work/boeva/rquiles
  save: /cluster/work/boeva/rquiles/outputs/save_CFF

title: "Internal alignment metrics across all ablations"
output: ${save}/unified_metrics_table.png
# figsize: [26, 22]      # inches; omitted -> derived from the grid size
dpi: 150

style: heatmap        # heatmap | rank_table | bars
                      #   heatmap    = value in each cell, cell coloured by rank
                      #                within its column (the default)
                      #   rank_table = value + rank, plus a mean-rank column
                      #   bars       = one bar-chart panel per metric
normalize: minmax     # minmax | zscore | rank - affects the COLOUR only, never the
                      # printed numbers. minmax stretches each column to the full
                      # colour range, so the best and worst run are always at the
                      # extremes however small the gap; zscore is gentler when one
                      # run is an outlier, which it will be with ~40 runs in view.
cmap: RdYlGn
show_families: true   # bracket + label under each metric family
transpose: false      # false -> runs as rows (right choice with this many runs)
annotate: true        # print the value in every cell

# Text size. `font_scale` multiplies everything; `font_sizes` then pins individual
# roles in points. Raising a size grows the figure rather than letting labels
# collide — the column headers are rotated and the row labels sit in a margin, so
# both need room in proportion to their size.
# Roles: row_label, col_label, value, group_name, family_name, colorbar_label,
#        colorbar_tick, suptitle, footnote, and — `style: bars` only — bar_value,
#        metric_title, legend, no_data. An unknown role is an error at load time.
font_scale: 1.0
# font_sizes:
#   row_label: 11       # run names down the left margin
#   value: 6            # the number inside each cell
#   col_label: 9        # rotated metric names across the top

# Omit to get the curated default set (the same 17 metrics unified_metrics.png shows).
# `--list` prints everything available in the selected runs. The subset below drops the
# raw-L2 metrics, which are scale-dependent and so not comparable between models whose
# embeddings have different norms.
metrics:
  - recon_pearson_r
  - recon_mae_bins
  - paired_cosine_sim_mean
  - paired_rank_mean
  - paired_rank_l2_mean
  - paired_random_baseline_cosine     # reference level, drawn grey (no direction)
  - agg_paired_cosine_pb_to_mean_sc
  - agg_synth_cosine_pb_to_mean_sc
  - contrastive_cross_cosine_mean
  - contrastive_within_bulk_cosine    # spread diagnostics, drawn grey
  - contrastive_within_pb_cosine
  - contrastive_wasserstein

# Omit the whole block for no scIB columns. Tags are the four benchmarks
# unified_metrics.py runs: bulk_vs_pb, paired_vs_nonpaired, paired_bulk_vs_paired_pb,
# nonpaired_bulk_vs_synth_pb (the last three only exist where the dataset has paired
# rows, so paired_bulk_vs_paired_pb is blank for the non-paired experiments below).
scib:
  tags: [bulk_vs_pb, paired_bulk_vs_paired_pb]
  # iLISI only, on purpose: it is the only global, label-free mixing measure here.
  # BRAS and kBET are computed per label group and skip labels holding a single batch,
  # which on tissue_general data leaves very few usable labels, and PCR comparison
  # clips to 0. Add the others knowingly - see the caveat block in
  # unified_metrics.run_scib_benchmark and evaluate/check/diagnose_scib.py.
  metrics: [iLISI]

# Display names must be unique across the whole config (they label the rows), which is
# why each carries its experiment in brackets - 'unified' alone appears in six
# ablations. The group bracket down the left margin repeats the experiment name, so the
# short tag in brackets is only there to disambiguate.
groups:

  # ── Paired datasets ─────────────────────────────────────────────────────────
  # These carry paired bulk/pseudobulk rows, so the paired_* and agg_paired_*
  # families actually populate here. Four variants of the same ablation on
  # differently preprocessed inputs.

  - name: "Paired · CPM"                    # paired_aggfix.json
    dir: ${save}/ablation_paired_dataset
    experiments:
      - {name: "Bulk baseline (cpm)", model: bulk_baseline}
      - {name: "Unified (cpm)",       model: unified}
      - {name: "DAT (cpm)",           model: dat}
      - {name: "Contrastive (cpm)",   model: contrastive}

  - name: "Paired · counts"                 # paired_counts.json
    # NOTE: paired_counts.json and paired_config_cscs.json both write to
    # '${work}/outputs_rquiles/save_CFF/ablation_paired_counts' - 'outputs_rquiles',
    # not 'outputs' like every other config. evaluate/analysis_all_experiments.yaml
    # uses 'outputs'; if this group comes back empty, that is the first thing to check.
    dir: ${save}/ablation_paired_counts
    experiments:
      - {name: "Bulk baseline (counts)", model: bulk_baseline}
      - {name: "Unified (counts)",       model: unified}
      - {name: "DAT (counts)",           model: dat}
      - {name: "Contrastive (counts)",   model: contrastive}
      - {name: "Aggregation (counts)",   model: aggregation}

  - name: "Paired · CORN"                   # paired_corn.json
    dir: ${save}/ablation_paired_corn
    experiments:
      - {name: "Bulk baseline (corn)", model: bulk_baseline}
      - {name: "Unified (corn)",       model: unified}
      - {name: "DAT (corn)",           model: dat}
      - {name: "Contrastive (corn)",   model: contrastive}
      - {name: "Aggregation (corn)",   model: aggregation}

  - name: "Paired · mix"                    # paired_mix.json
    dir: ${save}/ablation_paired_mix
    experiments:
      - {name: "Unified (mix)",     model: unified}
      - {name: "DAT + agg (mix)",   model: dat_agg}

  # ── Objective ablations on non-paired data ──────────────────────────────────
  # No paired rows in these datasets, so paired_* / agg_paired_* come back n/a and
  # the contrastive_* family is computed against synthetic pseudobulks.

  - name: "Base comparison"                 # base_comparison_ablation.json
    dir: ${save}/ablation_base_comparison
    experiments:
      - {name: "Unified baseline (base)", model: unified_baseline}
      - {name: "Contrastive (base)",      model: contrastive}
      - {name: "Aggregation (base)",      model: aggregation}
      - {name: "DAT (base)",              model: dat}

  - name: "Big condition"                   # big_condition.json + fill.json
    dir: ${save}/ablation_big_condition
    experiments:
      - {name: "Unified (big cond)", model: unified}
      - {name: "DAT (big cond)",     model: dat}
      - {name: "MMD (big cond)",     model: mmd}
      - {name: "CDD (big cond)",     model: cdd}

  - name: "United data"                     # eheiss_data.json
    dir: ${save}/ablation_united_data
    experiments:
      - {name: "Unified (united)", model: unified}
      - {name: "DAT (united)",     model: dat}
      - {name: "MMD (united)",     model: mmd}
      - {name: "CDD (united)",     model: cdd}

  - name: "Monitor align"                   # monitor_align.json
    dir: ${save}/ablation_monitor_align
    experiments:
      - {name: "Unified (monitor)",   model: unified}
      - {name: "Condition (monitor)", model: condition}
      - {name: "MMD (monitor)",       model: mmd}
      - {name: "DAT (monitor)",       model: dat}
      # Trained with distorted CDD source centroids (BulkSCCollator._aggregate_sc
      # applied expm1 to raw counts); fixed on 2026-07-31 but this arm was not
      # retrained. Do not read it as a clean test of the CDD objective.
      - {name: "CDD (monitor)*",      model: cdd}

  # ── No unified-FM objectives ────────────────────────────────────────────────
  # The reference group: what these metrics look like for models trained without
  # any of the alignment losses.

  - name: "Partition (no unified FM)"       # small_partition_ablation.json
    dir: ${save}/ablation_partition
    experiments:
      - {name: "Base model (part)",        model: base_model}
      - {name: "ZINB recon (part)",        model: zinb_reconstruction}
      - {name: "Denoise ZINB (part)",      model: denoise_zinb}
      - {name: "Contrastive (part)",       model: contrastive}
      - {name: "Agg + contrastive (part)", model: agg_contrastive}
      - {name: "DAT+agg+contr+ZINB (part)", model: dat_agg_contrastive_denoise_zinb}

# Excluded: example_ablation_config.json -> ablation_test on data/mixed_test. It is a
# template (conditions: [tissue], downstream tasks it has never run), so it is left out
# for the same reason evaluate/analysis_all_experiments.yaml leaves it out.

# ── Alternatives ─────────────────────────────────────────────────────────────────
#
# Every model in a directory, without naming them (names default to the directory
# names, so this only works while they stay unique across groups):
#
# groups:
#   - name: "Monitor align"
#     dir: ${save}/ablation_monitor_align
#     all_models: true
#     exclude: [pca_baseline]
#
# A flat list, with no group banding:
#
# experiments:
#   - {name: "Unified", dir: "${save}/ablation_monitor_align", model: unified}
#   - {name: "CDD",     dir: "${save}/ablation_monitor_align", model: cdd}
#   - path: ${save}/ablation_monitor_align/dat      # name defaults to the dir name
